name: SLSA generic generator
on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    outputs:
      digests: ${{ steps.hash.outputs.digests }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Build LogSentinel Parser
        run: |
          cargo build --release
          mkdir -p artifacts
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp target\release\deps\liblogsentinel_parser-*.rlib artifacts\ || echo "No .rlib found"
            if [ -f target\release\logsentinel-parser.exe ]; then
              cp target\release\logsentinel-parser.exe artifacts\
            fi
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            cp target/release/deps/liblogsentinel_parser-*.rlib artifacts/ || echo "No .rlib found"
            if [ -f target/release/logsentinel-parser ]; then
              cp target/release/logsentinel-parser artifacts/
            fi
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            cp target/release/deps/liblogsentinel_parser-*.rlib artifacts/ || echo "No .rlib found"
            if [ -f target/release/logsentinel-parser ]; then
              cp target/release/logsentinel-parser artifacts/
            fi
          fi

      - name: Generate subject for provenance
        id: hash
        run: |
          set -euo pipefail
          files=$(ls artifacts/*)
          echo "hashes=$(sha256sum $files | base64 -w0)" >> "${GITHUB_OUTPUT}"

  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v1.4.0
    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      upload-assets: true
